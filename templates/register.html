<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | My Diary</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <div class="card" style="
        max-width:500px;
        margin:60px auto;
    ">

        <div style="
            text-align:center;
            margin-bottom:25px;
        ">

            <div style="
                font-size:70px;
                margin-bottom:10px;
            ">
                ✨
            </div>

            <h1>Create Account</h1>

            <p style="
                color:#6b7280;
                margin-top:8px;
            ">
                Start your private digital diary journey.
            </p>

        </div>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST">

            <div class="form-group">

                <label>
                    <strong>Username</strong>
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Choose a username"
                    required>

            </div>

            <div class="form-group">

                <label>
                    <strong>Password</strong>
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    required>

            </div>

            <button
                type="submit"
                class="btn primary full">
                🚀 Create Account
            </button>

        </form>

        <div style="
            text-align:center;
            margin-top:20px;
        ">

            <p>
                Already have an account?
            </p>

            <a href="/login"
               class="back-link">
               Login Here
            </a>

        </div>

    </div>

</div>

</body>
</html>
